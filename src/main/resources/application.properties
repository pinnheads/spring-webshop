spring.application.name=da-25-26
# Watch the source folder directly for changes
spring.devtools.restart.additional-paths=src/main/java,src/main/resources

# POINT THYMELEAF DIRECTLY TO YOUR SOURCE CODE
spring.thymeleaf.prefix=file:src/main/resources/templates/

# Disable caches for all common template engines
spring.thymeleaf.cache=false
spring.freemarker.cache=false
spring.groovy.template.cache=false
spring.mustache.cache=false

# Prevent browser from caching static assets
spring.web.resources.cache.period=0

# Serve static resources directly from the source folder
spring.web.resources.static-locations=file:src/main/resources/static/
