<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Details</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <header th:replace="fragments.header :: header"></header>

  <div class="details">
    <h2 class="product-name">Product: <span th:text="${item.name}">Name</span></h2>
    <p class="product-size">Size: <span th:text="${item.size}">Size</span></p>
    <p class="product-color">Color: <span th:text="${item.color}">Color</span></p>
    <p class="product-price">Price: $<span th:text="${#numbers.formatDecimal(item.price, 1, 2)}">Price</span></p>
    <button type="button"><a th:href="@{/api/cart/add/{id}(id=${item.id})}">Add to cart</a></button>
  </div>
</body>

</html>
